name: validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install requests pytest pyyaml
      - name: Multi-target secrecy policy
        run: pytest -q policy
      - name: Python-version guard tests
        run: pytest -q test_python_version.py

  coverage:
    # Offline coverage floor (#22): unit/ and tests/security run under
    # coverage with a >=80% branch floor on each measured production
    # module; the combined report also lists the live browser scripts
    # (e2e_audit.py, form_validation.py) at their honest 0% so the
    # denominator stays public. docs/coverage-baseline.md has the baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install requests pytest coverage
      - name: Floored offline coverage
        run: |
          coverage erase
          coverage run --branch --source=e2e,report,scripts -m pytest --noconftest unit tests/security -q
          coverage report --include=e2e/budgets.py --fail-under=80
          coverage report --include=e2e/site_profile.py --fail-under=80
          coverage report --include=report/suggestions.py --fail-under=80
          coverage report --include=report/build_report.py --fail-under=80
          coverage report --include=scripts/ci/run_summary.py --fail-under=80
          coverage report --include=scripts/security/scorecard_guard.py --fail-under=80
      - name: Combined denominator report (informational)
        run: |
          coverage report -m | tee coverage-combined.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-combined.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [policy, coverage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
