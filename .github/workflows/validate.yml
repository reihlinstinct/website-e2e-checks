name: validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install requests pytest pyyaml
      - name: Multi-target secrecy policy
        run: pytest -q policy

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [policy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
