name: site-checks
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: pytest -q
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
