name: site-checks
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      SITE_PROFILE_JSON: ${{ secrets.SITE_PROFILE_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install requests pytest playwright >/dev/null 2>&1
      # Public repo: nothing about the target may reach logs or artifacts in clear text.
      - name: Run checks (quiet)
        run: |
          mkdir -p reports
          set +e
          pytest tests -q --tb=no -rN --junitxml=reports/junit.xml >/dev/null 2>&1
          playwright install --with-deps chromium >/dev/null 2>&1
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.2/axe.min.js -o axe.min.js
          python e2e/e2e_audit.py reports/shots axe.min.js >/dev/null 2>&1
          python report/build_report.py reports/junit.xml reports/shots/report.json > reports/report.md 2> reports/counts.txt
          echo "check run finished"
      - name: Encrypt report to the recipient certificate
        run: openssl cms -encrypt -aes-256-cbc -in reports/report.md -out report.p7m -outform DER certs/report-recipient.pem
      - name: Counts only (public)
        run: cat reports/counts.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: encrypted-report
          path: report.p7m
          retention-days: 14

  checks-b:
    # Manual only: the second target is not on the weekly schedule.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ secrets.SITE_URL_B }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install requests pytest playwright >/dev/null 2>&1
      # Second target. Detailed report encrypted to its own private certificate (never the first target's).
      # Public log and summary show counts only.
      - name: Run checks (quiet)
        run: |
          mkdir -p reports
          set +e
          pytest tests -q --tb=no -rN --junitxml=reports/junit.xml >/dev/null 2>&1
          playwright install --with-deps chromium >/dev/null 2>&1
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.2/axe.min.js -o axe.min.js
          python e2e/e2e_audit.py reports/shots axe.min.js >/dev/null 2>&1
          python report/build_report.py reports/junit.xml reports/shots/report.json > reports/report.md 2> reports/counts.txt
          echo "check run finished"
      - name: Encrypt report to the private certificate
        run: openssl cms -encrypt -aes-256-cbc -in reports/report.md -out report-b.p7m -outform DER certs/private-report-recipient.pem
      - name: Counts only (public)
        run: cat reports/counts.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: encrypted-report-b
          path: report-b.p7m
          retention-days: 14
